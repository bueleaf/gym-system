server:
  port: 8081

spring:
  application:
    name: training-aggregator
  data:
    mongodb:
      uri: mongodb://localhost:27017/gym_db
      auto-index-creation: true

  activemq:
    broker-url: "tcp://localhost:61616?jms.redeliveryPolicy.maximumRedeliveries=3"
    user: admin
    password: admin

messaging:
  trainer-workload-queue: trainer.workload.queue

logging:
  level:
    root: INFO

  pattern:
    console: "%X{transactionId} %msg%n"

security:
  jwt:
    publicKey: classpath:keys/public.pem
    issuer: gym-system