spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gym_db
    username: gym_user
    password: gym_password

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true

  sql:
    init:
      mode: always

messaging:
  trainer-workload-queue: trainer.workload.queue