services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: gym_db
      POSTGRES_USER: gym_user
      POSTGRES_PASSWORD: gym_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym_user -d gym_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  activemq:
    image: apache/activemq:latest
    ports:
      - "61616:61616"
      - "8161:8161"

  gym:
    build:
      context: ./gym
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gym_db
      SPRING_DATASOURCE_USERNAME: gym_user
      SPRING_DATASOURCE_PASSWORD: gym_password

      SPRING_ACTIVEMQ_BROKER_URL: tcp://activemq:61616
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_started

  training-aggregator:
    build:
      context: ./training-aggregator
    ports:
      - "8081:8081"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/gym_db

      SPRING_ACTIVEMQ_BROKER_URL: "tcp://activemq:61616?jms.redeliveryPolicy.maximumRedeliveries=3"
    depends_on:
      mongodb:
        condition: service_healthy
      activemq:
        condition: service_started

volumes:
  postgres-data:
  mongo-data: